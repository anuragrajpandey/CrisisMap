name: Build CrisisMap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Validate backend JavaScript
        run: |
          node --check server.js
          node --check controllers/authController.js
          node --check controllers/incidentController.js
          node --check controllers/serviceController.js
          node --check controllers/responderController.js
